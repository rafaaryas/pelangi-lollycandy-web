    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/png" sizes="16x16" href="http://localhost/images/favicon-16x16.png?v=20260510">
<link rel="icon" type="image/png" sizes="32x32" href="http://localhost/images/favicon-32x32.png?v=20260510">

<link rel="apple-touch-icon" sizes="180x180" href="http://localhost/images/apple-touch-icon.png?v=20260510">
<link rel="manifest" href="http://localhost/site.webmanifest?v=20260510">

<body class="login-page">
<div class="route-progress" data-route-progress aria-hidden="true"><span></span></div>
<main class="login-stage">
    <div class="login-container">
        <section class="login-panel" aria-labelledby="login-title">
            <a class="login-brand" href="http://localhost" aria-label="Pelangi Lollycandy, halaman utama">
                <img src="http://localhost/images/pelangi-logo.png" alt="Pelangi Lollycandy">
            </a>

            <div class="login-intro">
                <h1 id="login-title">Selamat datang kembali</h1>
                <p>Kelola operasional Pelangi Lollycandy melalui satu ruang kerja.</p>
            </div>

            
            <form class="login-form" method="POST" action="http://localhost/admin/login" data-login-form>
                <input type="hidden" name="_token" value="hFbjW9bPbi82AYpjPy2ydp3EC5KdKe1ciFg24qHM" autocomplete="off">                <div class="login-field-group">
                    <label for="login-email">Email</label>
                    <div class="login-input-wrap ">
                        <svg class="ui-icon " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                        <input id="login-email" type="email" name="email" value="" placeholder="Masukkan email" required autocomplete="email" >
                    </div>
                                    </div>

                <div class="login-field-group">
                    <label for="login-password">Password</label>
                    <div class="login-input-wrap ">
                        <svg class="ui-icon login-password-mark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3M12 14v3"/></svg>
                        <input id="login-password" type="password" name="password" placeholder="Masukkan password" required autocomplete="current-password" >
                        <button class="password-toggle" type="button" data-password-toggle aria-label="Tampilkan password" title="Tampilkan password" aria-controls="login-password">
                            <span data-password-show-icon><svg class="ui-icon " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
</span>
                            <span data-password-hide-icon hidden><svg class="ui-icon " width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A11.4 11.4 0 0 1 12 5c6.5 0 10 7 10 7a13.5 13.5 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.1 0 2.1-.2 3-.5"/></svg>
</span>
                        </button>
                    </div>
                                    </div>

                <label class="login-remember"><input type="checkbox" name="remember" value="1" > <span>Ingat saya</span></label>
                <button class="login-submit" type="submit" data-login-submit>
                    <span data-login-submit-label>Masuk</span>
                </button>
            </form>

            <p class="login-footnote">Akses khusus untuk pengelola Pelangi Lollycandy.</p>
        </section>

        <aside class="login-visual" aria-label="Foto Pelangi Lollycandy">
            <img src="http://localhost/images/ceria.jpg" alt="Suasana ceria Pelangi Lollycandy">
        </aside>
    </div>
</main>
</body>
</html>
